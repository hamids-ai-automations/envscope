name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e .

      - name: Compile
        run: python -m compileall -q src

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: CLI smoke test
        run: |
          envscope version
          envscope init --example examples/.env.example --out /tmp/envscope-ci.json
      - name: SARIF smoke test
        run: |
          (cd examples && PYTHONPATH=../src python -m envscope check --example .env.example --env .env --schema envscope.json --sarif /tmp/envscope.sarif) || true
          python - <<'PY'
          import json
          data = json.load(open("/tmp/envscope.sarif"))
          assert data["version"] == "2.1.0"
          assert data["runs"] and "results" in data["runs"][0]
          print("SARIF ok:", len(data["runs"][0]["results"]), "results")
          PY
